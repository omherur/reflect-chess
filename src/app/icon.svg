<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 6 76 76">
  <!--
    Favicon version of the mark. Standalone SVGs can't read the app's CSS
    variables, so the theme-dependent half is handled with a media query
    here instead — a silver king would vanish against a light browser tab,
    and a charcoal one against a dark tab.
  -->
  <style>
    .bright { fill: #4a3f36; }
    .bright-stroke { stroke: #4a3f36; }
    @media (prefers-color-scheme: dark) {
      .bright { fill: #d8dade; }
      .bright-stroke { stroke: #d8dade; }
    }
  </style>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9ae67" />
      <stop offset="55%" stop-color="#b3792f" />
      <stop offset="100%" stop-color="#8a5a22" />
    </linearGradient>
    <clipPath id="left"><rect x="0" y="0" width="50" height="100" /></clipPath>
    <clipPath id="right"><rect x="50" y="0" width="50" height="100" /></clipPath>
    <path id="king" d="M47.5 18 h5 v4 h4.5 v4.5 h-4.5 v5.5 C62 33.5 65.5 36.5 65.5 41 C65.5 45.5 62.5 48.5 58.5 50 C60.5 55 61.5 60.5 61 65 C60.7 68.5 62.5 71 66 73.5 L68.5 75.5 L68.5 79 L31.5 79 L31.5 75.5 L34 73.5 C37.5 71 39.3 68.5 39 65 C38.5 60.5 39.5 55 41.5 50 C37.5 48.5 34.5 45.5 34.5 41 C34.5 36.5 38 33.5 47.5 32 v-5.5 h-4.5 v-4.5 h4.5 v-4 Z" />
    <g id="king-full">
      <use href="#king" />
      <rect x="36" y="48.6" width="28" height="5.4" rx="2.7" />
      <rect x="38.8" y="55.4" width="22.4" height="3.4" rx="1.7" />
    </g>
  </defs>

  <path d="M49 11 A34 34 0 0 0 20 70" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" />
  <path d="M51 11 A34 34 0 0 1 80 70" fill="none" class="bright-stroke" stroke-width="3" stroke-linecap="round" />

  <g clip-path="url(#left)" fill="url(#gold)"><use href="#king-full" /></g>
  <g clip-path="url(#right)" class="bright"><use href="#king-full" /></g>
</svg>
